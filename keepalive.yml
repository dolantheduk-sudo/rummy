# Keeps the free Supabase project from pausing: reads the database every 2 days.
# Save at: .github/workflows/keepalive.yml in the rummy repo.
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 14 */2 * *"     # every 2 days
  workflow_dispatch: {}          # lets you run it by hand from the Actions tab
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from the game database
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://kkfnhytkojvdvyayhsxj.supabase.co/rest/v1/rummy_games?select=code&limit=1" \
            -H "apikey: sb_publishable_G_jk3EUPRAMZHbgj7jRpWQ_WaKaBWFH")
          echo "Supabase answered: $code"
          test "$code" = "200"
