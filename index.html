function applyRemote(row){
  if (!row || row.version < G.version) return;
  if (row.version === G.version && G.state) return;
  const prev = G.state;
  G.state = row.state; G.version = row.version;
  const s = G.state;
  if (s.hands && s.hands[G.pid]) {
    const h = new Set(s.hands[G.pid]);
    G.sel = new Set([...G.sel].filter(c=>h.has(c)));
    G.staged = G.staged.map(g=>g.filter(c=>h.has(c))).filter(g=>g.length);
    if (s.down && s.down[G.pid]) G.staged = [];
  }
  const events = prev ? (s.log||[]).filter(e=>e.n > (prev.seq||0)) : [];
  const chatNew = prev ? (s.chat||[]).filter(m=>m.n > (prev.chatSeq||0)) : [];
  G.events = events;
  const mine = s.status==="playing" && s.players[s.turn] && s.players[s.turn].id===G.pid;
  let turnDelay = 0;
  for (const e of events) turnDelay = Math.max(turnDelay, playEvent(e, s));
  if (mine && !G.wasMyTurn && prev) setTimeout(()=>alertTurn(), turnDelay);
  G.wasMyTurn = mine;
  // live stickers (only fresh ones)
  if (G.code && G.pid) Presence.start(G.code, G.pid, onPresence);
  if (G.code && G.pid && pidx(s,G.pid)>=0) Push.registerGame(G.code, G.pid);
  if (!prev && isActive(s) && Date.now() - lastActivity(s) >= STALE_DAYS*864e5) setTimeout(()=>act("expire"), 50);
  for (const m of chatNew) {
    if (m.vs && Date.now()-m.t < 120000) setTimeout(()=>popVoice(m.vs, m.p, m.p===G.pid), 100);
    else if (m.st && Date.now()-m.t < 120000) setTimeout(()=>popSticker(m.st, m.p, m.p===G.pid), 100);
    else if (m.p!==G.pid && G.modalKind!=="chat") { Sound.play("chip"); toast(`💬 ${pname(s,m.p)}: ${m.text||""}`); }
  }
  if (G.modalKind==="chat") { localStorage.setItem(readKey(), String(s.chatSeq||0)); refreshChat(); }
  if (s.status==="gameOver") Rivalry.record(s);
  document.title = mine ? "🔔 Your turn — Shanghai Rummy" : "Shanghai Rummy";
  render();
  G.events = [];
}
// sounds + big effects for a log event; returns ms to wait before a "your turn" banner
function playEvent(e, s){
  const me = G.pid, other = e.p && e.p!==me;
  switch (e.k) {
    case "join": Sound.play("chime"); FX.burst(innerWidth/2, 140, 40); return 0;
    case "deal": {
      G.dealAnim = true;
      const n = CONTRACTS[s.round].n;
      const t = Sound.play("shuffle") || 0;
      Sound.play("deal", n, .075, t+.1);
      setTimeout(()=>showBanner(`Round ${s.round+1}`, contractText(s.round), 1400), 50);
      return 1600 + n*75;
    }
    case "draw": Sound.play("flick"); return other ? 400 : 0;
    case "pick": Sound.play("slide"); return other ? 400 : 0;
    case "discard": Sound.play("flick"); Sound.play("thud", .18); return 500;
    case "lay": Sound.play("sparkle"); Sound.play("coins", 6); setTimeout(()=>FX.suits(innerWidth/2, innerHeight*.45, 14), 250); return 600;
    case "off": Sound.play("chip"); return 200;
    case "undo": Sound.play("slide"); return 0;
    case "reshuffle": Sound.play("shuffle"); return 600;
    case "ended":
      if (e.p && e.p!==me) { Sound.play("aww"); toast(`${pname(s,e.p)} cancelled the game`); }
      return 0;
    case "concede": {
      G.holdResult = Date.now() + 2300; setTimeout(()=>render(), 2350);
      if (e.w===me) { Sound.play("fanfare"); setTimeout(()=>Sound.play("coins",18), 600); showBanner("You win!", `${pname(s,e.p)} conceded`, 2200); FX.confetti(160); FX.coins(50); }
      else if (e.p===me) { Sound.play("aww"); showBanner("Game conceded", `${pname(s,e.w)} takes this one`, 2000); }
      else { Sound.play("aww"); showBanner(`${pname(s,e.w)} wins!`, `${pname(s,e.p)} conceded`, 2000); }
      return 0;
    }
    case "nudge":
      if (e.to===me) { Sound.play("doorbell"); try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(x){} showBanner("👉 Nudge!", `${pname(s,e.p)} is waiting on you`, 1800); }
      else if (e.p===me) toast(`👉 Nudged ${pname(s,e.to)}`);
      return 0;
    case "out": {
      G.holdResult = Date.now() + 1900;
      setTimeout(()=>render(), 1950);
      if (e.p===me) { Sound.play("fanfare"); setTimeout(()=>Sound.play("coins",18), 600); showBanner("You went out!", "🎉 Round " + (s.round+1) + " is yours", 1700); FX.confetti(160); FX.coins(40); }
      else { Sound.play("aww"); showBanner(`${pname(s,e.p)} went out!`, "Round " + (s.round+1) + " is over", 1700); FX.confetti(70); }
      return 0;
    }
    case "over": {
      const w = gameWinner(s);
      setTimeout(()=>{ Sound.play("fanfare"); Sound.play("coins", 24); FX.fireworks(8); FX.coins(70); FX.confetti(180); }, 300);
      if (w && w!=="tie") setTimeout(()=>showBanner(w===me ? "You win!" : pname(s,w)+" wins!", "🏆 Lowest score takes it", 2200), 300);
      else if (w==="tie") setTimeout(()=>showBanner("It's a tie!", "🏆 Dead even", 2200), 300);
      return 0;
    }
  }
  return 0;
}

/* ---------- connection ---------- */
const Net = {
  down: !navigator.onLine,
  set(down){ if (this.down===down) return; this.down = down; this.paint(); if (!down) { refresh(); } },
  paint(){
    let b = document.getElementById("netbar");
    if (!this.down) { if (b) { b.classList.add("ok"); b.textContent = "✅ Back online"; setTimeout(()=>{ if (!Net.down) b.remove(); }, 1600); } return; }
    if (!b) { b = document.createElement("div"); b.id = "netbar"; document.body.appendChild(b); }
    b.classList.remove("ok"); b.innerHTML = `<span class="spin"></span> You're offline — reconnecting…`;
  }
};
addEventListener("offline", ()=>Net.set(true));
addEventListener("online", ()=>Net.set(false));
async function refresh(){
  if (!G.be) return;
  try { const row = await G.be.get(); Net.set(false); if (G.loadError) { G.loadError = null; } if (row) { if (!G.pid) resolvePid(G.code, row.state); applyRemote(row); } }
  catch(e){ if (ONLINE) Net.set(true); }
}

// Chat, looks and nudges wait their turn instead of being dropped; game moves ignore double-taps.
const QUEUED = new Set(["say","look","nudge"]);
async function act(name, ...args){
  if (ONLINE && (Net.down || !SB)) { toast("You're offline — nothing was sent. Try again when you're connected.", true); return false; }
  if (G.busy) { if (!QUEUED.has(name)) return false; while (G.busy) await sleep(60); }
  G.busy = true;
  try {
    for (let tries=0; tries<6; tries++) {
      const cur = await G.be.get();
      let ns;
      try { ns = Actions[name](structuredClone(cur.state), G.pid, ...args); }
      catch(e){ G.busy = false; applyRemote(cur); toast(e.message, true); return false; }
      if (!ns) { G.busy = false; applyRemote(cur); return false; }
      const leftover = ns._leftover; delete ns._leftover;
      if (await G.be.write(ns, cur.version)) {
        G.busy = false;
        applyRemote({state:ns, version:cur.version+1});
        if (leftover && leftover.length) toast(leftover.map(cardName).join(", ") + " didn't fit");
        return true;
      }
    }
    toast("Someone else moved at the same time — try again");
  } catch(e){ if (ONLINE && !navigator.onLine) Net.set(true); toast(Net.down ? "You're offline — nothing was sent. Try again when you're connected." : e.message, true); }
  finally { G.busy = false; }
  return false;
}

/* ---------- all-time rivalry (by name) ---------- */
const Rivalry = {
  pairKey: s => s.players.map(p=>Profiles.key(p.name)).sort().join("|"),
  async record(s){
    const id = G.code + "-" + s.created;
    if (localStorage.getItem("sr_rec_"+id)) return;
    const key = p => Profiles.key(p.name);
    const tot = s.players.map(p=>({n:key(p), t:(s.scores[p.id]||[]).reduce((a,b)=>a+b,0)})).sort((a,b)=>a.t-b.t);
    const w = gameWinner(s);
    const winner = w==="tie" ? "tie" : key(s.players.find(p=>p.id===w) || {name:""});
    const st = s.stats || {};
    const detail = {
      rounds: Object.fromEntries(s.players.map(p=>[key(p), s.scores[p.id]||[]])),
      outs:   Object.fromEntries(s.players.map(p=>[key(p), (st[p.id]||{}).outs||0])),
      disc:   Object.fromEntries(s.players.map(p=>[key(p), (st[p.id]||{}).disc||{}])),
      picks:  Object.fromEntries(s.players.map(p=>[key(p), (st[p.id]||{}).picks||0])),
      reason: s.endReason || "finished", rounds: roundsOf(s),
      conceded: s.concededBy ? key(s.players.find(p=>p.id===s.concededBy)||{name:""}) : null,
    };
    const row = {id, pair:this.pairKey(s), winner, totals:Object.fromEntries(tot.map(x=>[x.n,x.t])), detail, finished_at:new Date().toISOString()};
    try {
      if (ONLINE && SB) { const {error} = await SB.from("rummy_results").insert(row); if (error && error.code !== "23505") return; }
      else { const all = JSON.parse(localStorage.getItem("sr_results")||"{}"); all[id] = row; localStorage.setItem("sr_results", JSON.stringify(all)); }
      localStorage.setItem("sr_rec_"+id, "1"); History.load(true);
    } catch(e){}
  },
  html(s){
    if (!History.rows) { History.load(); return `<div class="rivalry muted">Loading all-time record…</div>`; }
    const pair = this.pairKey(s), rows = History.rows.filter(r=>r.pair===pair);
    if (!rows.length) return `<div class="rivalry muted">🏆 All-time record starts after your first full game</div>`;
    const wins = {}; let ties = 0; rows.forEach(r=>{ if (r.winner==="tie") ties++; else wins[r.winner]=(wins[r.winner]||0)+1; });
    const parts = s.players.map(p=>`${avatarHTML(p,"sm")} ${nameHTML(p)} <b class="num">${wins[Profiles.key(p.name)]||0}</b>`);
    return `<div class="rivalry">${parts.join('<span class="vs">vs</span>')}${ties?` <span class="muted">· ${ties} tie${ties>1?"s":""}</span>`:""}</div>`;
  }
};

/* ======================= PRESENCE ("thinking…", online, typing) ======================= */
const Presence = (()=>{
  let ch = null, bc = null, code = null, me = null, mine = {}, peers = {}, hb = null, onChange = ()=>{};
  const now = () => Date.now();
  function emitLocal(){ if (bc) bc.postMessage({pid:me, at:now(), ...mine, vis:!document.hidden}); }
  function changed(){ try { onChange(); } catch(e){} }
  return {
    start(c, pid, cb){
      if (code===c && me===pid) return;
      this.stop(); code = c; me = pid; onChange = cb || onChange; peers = {};
      if (ONLINE && SB) {
        ch = SB.channel("room-"+c, {config:{presence:{key:pid}}});
        ch.on("presence", {event:"sync"}, ()=>{
          const st = ch.presenceState(); const next = {};
          for (const k in st) { const metas = st[k]; const m = metas[metas.length-1] || {}; next[k] = {at:now(), vis:m.vis!==false, typing:!!m.typing}; }
          peers = next; changed();
        });
        ch.subscribe(async status=>{ if (status==="SUBSCRIBED") await ch.track({vis:!document.hidden, typing:false}); });
      } else if ("BroadcastChannel" in window) {
        bc = new BroadcastChannel("sr_presence_"+c);
        bc.onmessage = e=>{ const d = e.data; if (!d || d.pid===me) return; peers[d.pid] = {at:d.at, vis:d.vis, typing:!!d.typing}; changed(); };
        hb = setInterval(()=>{ emitLocal(); for (const k in peers) if (now()-peers[k].at > 9000) { delete peers[k]; changed(); } }, 3000);
        emitLocal();
      }
    },
    stop(){ try { ch && SB.removeChannel(ch); } catch(e){} try { bc && bc.close(); } catch(e){} clearInterval(hb); ch = bc = null; code = null; peers = {}; },
    set(fields){
      Object.assign(mine, fields);
      if (ch) ch.track({vis:!document.hidden, typing:!!mine.typing}).catch(()=>{});
      emitLocal();
    },
    get(pid){ const p = peers[pid]; return p ? {online:true, active:p.vis, typing:p.typing} : {online:false}; },
  };
})();
document.addEventListener("visibilitychange", ()=>Presence.set({}));

/* ======================= MEDIA (selfies + voice stickers) ======================= */
const Media = {
  async upload(blob, folder, ext){
    const name = `${folder}/${Profiles.key(G.state && (G.state.players.find(p=>p.id===G.pid)||{}).name || "player").replace(/[^a-z0-9]/g,"") || "p"}-${Date.now()}-${Math.random().toString(36).slice(2,6)}.${ext}`;
    if (!ONLINE) return await new Promise(r=>{ const f = new FileReader(); f.onload = ()=>r(f.result); f.readAsDataURL(blob); });
    const {error} = await SB.storage.from("rummy-media").upload(name, blob, {contentType:blob.type, upsert:false});
    if (error) throw new Error(error.message);
    return SB.storage.from("rummy-media").getPublicUrl(name).data.publicUrl;
  },
  // Pick/take a photo, crop to a centered square, shrink to 320px JPEG.
  pickSelfie(){
    return new Promise((resolve, reject)=>{
      const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*"; inp.setAttribute("capture","user");
      inp.onchange = async ()=>{
        const f = inp.files && inp.files[0]; if (!f) return resolve(null);
        try {
          const img = await createImageBitmap(f).catch(async ()=>{ const u = URL.createObjectURL(f); const im = new Image(); im.src = u; await im.decode(); return im; });
          const side = Math.min(img.width, img.height), sx = (img.width-side)/2, sy = (img.height-side)/2.6;
          const c = document.createElement("canvas"); c.width = c.height = 320;
          const x = c.getContext("2d"); x.imageSmoothingQuality = "high"; x.drawImage(img, sx, Math.max(0,sy), side, side, 0, 0, 320, 320);
          c.toBlob(b=>resolve(b), "image/jpeg", .84);
        } catch(e){ reject(e); }
      };
      inp.click();
    });
  },
  // Records microphone audio and encodes WAV, which plays on every iPhone and Android.
  rec: null,
  async startRec(onLevel){
    const stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}});
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    const src = ac.createMediaStreamSource(stream);
    const proc = ac.createScriptProcessor(4096, 1, 1);
    const chunks = [];
    proc.onaudioprocess = e=>{ const d = e.inputBuffer.getChannelData(0); chunks.push(new Float32Array(d)); let m=0; for (let i=0;i<d.length;i+=64) m=Math.max(m,Math.abs(d[i])); onLevel && onLevel(m); };
    src.connect(proc); proc.connect(ac.destination);
    this.rec = {stream, ac, src, proc, chunks, rate:ac.sampleRate, t0:Date.now()};
  },
  async stopRec(){
    const r = this.rec; if (!r) return null; this.rec = null;
    try { r.proc.disconnect(); r.src.disconnect(); } catch(e){}
    r.stream.getTracks().forEach(t=>t.stop()); try { await r.ac.close(); } catch(e){}
    const len = r.chunks.reduce((a,c)=>a+c.length,0); const all = new Float32Array(len); let o=0; r.chunks.forEach(c=>{ all.set(c,o); o+=c.length; });
    // trim silence at the ends, normalise, downsample to 16 kHz
    let s=0, e=all.length-1; const th=.015; while (s<e && Math.abs(all[s])<th) s++; while (e>s && Math.abs(all[e])<th) e--;
    s = Math.max(0, s - r.rate*.05|0); e = Math.min(all.length-1, e + r.rate*.12|0);
    const seg = all.subarray(s, e+1); if (seg.length < r.rate*.25) return null;
    let peak = 0; for (let i=0;i<seg.length;i++) peak = Math.max(peak, Math.abs(seg[i]));
    const gain = peak>0 ? Math.min(4, .92/peak) : 1;
    const outRate = 16000, ratio = r.rate/outRate, n = Math.floor(seg.length/ratio);
    const buf = new ArrayBuffer(44 + n*2), v = new DataView(buf);
    const w = (o,str)=>{ for (let i=0;i<str.length;i++) v.setUint8(o+i, str.charCodeAt(i)); };
    w(0,"RIFF"); v.setUint32(4,36+n*2,true); w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,outRate,true); v.setUint32(28,outRate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,"data"); v.setUint32(40,n*2,true);
    for (let i=0;i<n;i++){ const a = Math.floor(i*ratio), b = Math.min(seg.length-1, Math.floor((i+1)*ratio)); let sum=0; for (let j=a;j<=b;j++) sum+=seg[j];
      const x = Math.max(-1, Math.min(1, sum/(b-a+1)*gain)); v.setInt16(44+i*2, x<0?x*0x8000:x*0x7fff, true); }
    return {blob:new Blob([buf], {type:"audio/wav"}), secs:n/outRate};
  },
  cancelRec(){ const r = this.rec; this.rec = null; if (!r) return; try { r.proc.disconnect(); r.src.disconnect(); } catch(e){} r.stream.getTracks().forEach(t=>t.stop()); try { r.ac.close(); } catch(e){} },
  _cache: {},
  async play(url){
    Sound.init();
    const ctx = Sound.ctx(); if (!ctx || !Sound.on) return;
    try {
      let buf = this._cache[url];
      if (!buf) { const ab = await (await fetch(url)).arrayBuffer(); buf = await new Promise((res,rej)=>ctx.decodeAudioData(ab, res, rej)); this._cache[url] = buf; }
      const s = ctx.createBufferSource(); s.buffer = buf; const g = ctx.createGain(); g.gain.value = 1.4; s.connect(g).connect(ctx.destination); s.start();
    } catch(e){ const a = new Audio(url); a.play().catch(()=>{}); }
  }
};

/* ======================= HISTORY: rivalry, champion, stats ======================= */
const History = {
  rows: null, at: 0, loading: null,
  async load(force){
    if (!force && this.rows && Date.now()-this.at < 60000) return this.rows;
    if (this.loading) return force ? this.loading.then(()=>this.load(true)) : this.loading;
    const pr = (async ()=>{
      await null;
      let rows = [];
      try {
        if (ONLINE && SB) { const {data} = await SB.from("rummy_results").select("id,pair,winner,totals,detail,finished_at").order("finished_at", {ascending:true}); rows = data||[]; }
        else rows = Object.values(JSON.parse(localStorage.getItem("sr_results")||"{}")).sort((a,b)=>(a.finished_at||"").localeCompare(b.finished_at||""));
      } catch(e){}
      this.rows = rows; this.at = Date.now();
      const before = this.championKey; this.computeChampion();
      if (before !== this.championKey && typeof render==="function" && G.state) render();
      document.querySelectorAll(".rivalry").forEach(el=>{ if (G.state) el.outerHTML = Rivalry.html(G.state); });
      return rows;
    })();
    this.loading = pr;
    pr.finally(()=>{ if (this.loading===pr) this.loading = null; });
    return pr;
  },
  champions: new Set(), championKey: "",
  computeChampion(){
    const wins = {}; (this.rows||[]).forEach(r=>{ if (r.winner && r.winner!=="tie") wins[r.winner] = (wins[r.winner]||0)+1; });
    const max = Math.max(0, ...Object.values(wins));
    this.champions = new Set(max>0 ? Object.keys(wins).filter(k=>wins[k]===max) : []);
    this.championKey = [...this.champions].sort().join("|") + ":" + max;
    this.topWins = max;
  },
  isChampion(name){ return this.champions.has(Profiles.key(name)); },
  statsFor(name){
    const n = Profiles.key(name), rows = (this.rows||[]).filter(r=>r.totals && n in r.totals);
    const st = {games:rows.length, wins:0, ties:0, streak:0, best:0, rounds:0, outs:0, pts:0, low:null, high:null, disc:{}, h2h:{}, last:[]};
    let run = 0;
    rows.forEach(r=>{
      const won = r.winner===n, tie = r.winner==="tie";
      if (won) { st.wins++; run++; st.best = Math.max(st.best, run); } else { run = 0; if (tie) st.ties++; }
      const t = r.totals[n]; st.low = st.low===null ? t : Math.min(st.low, t); st.high = st.high===null ? t : Math.max(st.high, t);
      const d = r.detail || {};
      if (d.rounds && d.rounds[n]) { st.rounds += d.rounds[n].length; st.pts += d.rounds[n].reduce((a,b)=>a+b,0); }
      if (d.outs && d.outs[n]) st.outs += d.outs[n];
      if (d.disc && d.disc[n]) for (const k in d.disc[n]) st.disc[k] = (st.disc[k]||0) + d.disc[n][k];
      for (const o in r.totals) if (o!==n) { const h = st.h2h[o] = st.h2h[o] || {w:0,l:0,t:0}; if (won) h.w++; else if (tie) h.t++; else if (r.winner===o) h.l++; }
      st.last.push({won, tie, t});
    });
    st.streak = run;
    const fav = Object.entries(st.disc).sort((a,b)=>b[1]-a[1])[0];
    st.favDiscard = fav ? (fav[0]==="T"?"10":fav[0]==="W"?"Joker":fav[0]) : null;
    st.avg = st.rounds ? Math.round(st.pts/st.rounds) : null;
    st.pct = st.games ? Math.round(st.wins*100/st.games) : 0;
    st.last = st.last.slice(-10);
    return st;
  }
};

/* ======================= CARD MOTION (FLIP) ======================= */
function pageRect(el){ const r = el.getBoundingClientRect(); return {x:r.left+scrollX, y:r.top+scrollY, w:r.width, h:r.height}; }
function snapshot(){
  const m = new Map();
  document.querySelectorAll("#app [data-c]").forEach(el=>m.set(el.dataset.c, pageRect(el)));
  document.querySelectorAll("#app [data-pid]").forEach(el=>m.set("opp:"+el.dataset.pid, pageRect(el)));
  ["stock","dpile"].forEach(id=>{ const el=document.getElementById(id); if (el) m.set(id, pageRect(el.querySelector(".card:not(.under):not(.under2)")||el)); });
  return m;
}
function flipFrom(el, from, {dur=480, delay=0, rot=0, fadeIn=false}={}){
  const to = pageRect(el);
  const dx = from.x - to.x, dy = from.y - to.y, sx = from.w/to.w || 1, sy = from.h/to.h || 1;
  if (Math.abs(dx)<4 && Math.abs(dy)<14 && Math.abs(sx-1)<.05) return;
  el.style.transformOrigin = "0 0"; el.style.zIndex = 30;
  const a = el.animate([
    {transform:`translate(${dx}px,${dy}px) scale(${sx},${sy}) rotate(${rot}deg)`, opacity: fadeIn?0:1},
    {transform:`translate(${dx}px,${dy}px) scale(${sx},${sy}) rotate(${rot}deg)`, opacity:1, offset:.01},
    {transform:"none", opacity:1}
  ], {duration:dur, delay, easing:"cubic-bezier(.2,.75,.25,1)", fill:"backwards"});
  a.onfinish = ()=>{ el.style.zIndex=""; el.style.transformOrigin=""; };
}
function flyGhost(card, from, to, {dur=520, delay=0, cls="big"}={}){
  if (!from || !to) return;
  const holder = $("#flyer");
  const d = document.createElement("div"); d.innerHTML = cardHTML(card, cls); const el = d.firstElementChild;
  el.style.position="absolute"; el.style.left=from.x+"px"; el.style.top=from.y+"px"; el.style.width=from.w+"px"; el.style.height=from.h+"px"; el.style.margin="0";
  holder.appendChild(el);
  const sx = to.w/from.w, sy = to.h/from.h;
  const a = el.animate([{transform:"none",opacity:1},{transform:`translate(${to.x+to.w/2-from.x-from.w/2}px,${to.y+to.h/2-from.y-from.h/2}px) scale(${Math.min(sx,sy)}) rotate(8deg)`,opacity:.9}],
    {duration:dur, delay, easing:"cubic-bezier(.3,.6,.3,1)", fill:"both"});
  a.onfinish = ()=>el.remove();
}
function animateTable(before){
  const s = G.state, me = G.pid;
  if (!G.dealAnim && (!before || !before.size)) return;
  const stock = before.get("stock") || pageRect(document.querySelector("#stock .card:not(.under):not(.under2)"));
  if (G.dealAnim) {
    G.dealAnim = false;
    const cards = [...document.querySelectorAll(".hand .card")];
    const t0 = 600;
    cards.forEach((el,i)=>flipFrom(el, stock, {dur:420, delay:t0+i*75, rot:-25}));
    s.players.filter(p=>p.id!==me).forEach(p=>{
      const box = document.querySelector(`[data-pid="${p.id}"]`); if (!box) return;
      const to = pageRect(box); to.w = 26; to.h = 36; to.x += to.w*3;
      for (let i=0;i<Math.min(6,CONTRACTS[s.round].n);i++) flyGhost("back", stock, to, {delay:t0+i*150, dur:450});
    });
    const dt = document.querySelector("#dpile .card[data-c]"); if (dt) flipFrom(dt, stock, {delay:t0+cards.length*75, dur:400});
    return;
  }
  // existing cards that moved (hand reflow, hand→meld, hand→discard, discard→hand, staging)
  const actor = [...G.events].reverse().find(e=>e.p)?.p;
  document.querySelectorAll("#app [data-c]").forEach(el=>{
    const c = el.dataset.c, from = before.get(c);
    if (from) { flipFrom(el, from); return; }
    if (!G.events.length) return;
    if (el.closest(".hand")) {
      flipFrom(el, before.get(s.drawn && s.drawn.from==="discard" ? "dpile" : "stock") || stock, {dur:520, rot:-12});
      el.animate([{boxShadow:"0 0 0 3px #f5c542,0 0 24px #f5c542"},{boxShadow:"0 2px 5px rgba(0,0,0,.45)"}],{duration:1400,delay:500});
    } else if (actor && actor!==me && before.get("opp:"+actor)) {
      const o = before.get("opp:"+actor);
      flipFrom(el, {x:o.x+o.w-40, y:o.y, w:30, h:42}, {dur:600, rot:10});
    } else {
      el.animate([{transform:"scale(.3)",opacity:0},{transform:"none",opacity:1}],{duration:350,easing:"cubic-bezier(.2,1.6,.4,1)"});
    }
  });
  // opponent drew: card back flies to their seat
  for (const e of G.events) {
    if (e.p===me) continue;
    const box = document.querySelector(`[data-pid="${e.p}"]`); if (!box) continue;
    const to = pageRect(box); to.x += to.w - 60; to.w = 26; to.h = 36;
    if (e.k==="draw") flyGhost("back", stock, to);
    if (e.k==="pick" && e.c) flyGhost(e.c, before.get("dpile"), to);
  }
  // sparkle new melds
  document.querySelectorAll(".meld.pop").forEach(m=>{ const r=m.getBoundingClientRect(); setTimeout(()=>FX.burst(r.left+r.width/2, r.top+r.height/2, 30), 300); });
}

/* ======================= RENDERING ======================= */
function cardHTML(c, cls="big", extra=""){
  if (c==="back") return `<div class="card back ${cls} ${extra}"></div>`;
  if (isJoker(c)) return `<div class="card joker ${cls} ${extra}" data-c="${c}"><div class="c">★</div><div class="m"><span class="jk">★</span><span class="jkt">JOKER</span></div><div class="c2">★</div></div>`;
  const red = c[1]==="H"||c[1]==="D", r = rankLabel(c), su = SYM[c[1]];
  const mid = "JQK".includes(c[0]) ? `<div class="m face"><span class="fr">${r}</span><span class="fs">${su}</span></div>`
            : c[0]==="A" ? `<div class="m ace">${su}</div>` : `<div class="m">${su}</div>`;
  return `<div class="card ${red?"red":""} s-${c[1]} ${cls} ${extra}" data-c="${c}"><div class="c">${r}<br>${su}</div>${mid}<div class="c2">${r}<br>${su}</div></div>`;
}
/* ---------- player looks ---------- */
const AVATARS = ["🃏","🐱","🐶","🦋","🌸","🌻","🍀","🦄","🐝","🦊","🐼","🐧","🦉","🐢","🐠","🍒","🍓","🎲","💎","👑","⭐","🌙","☕","🍷","🧁","🎀","💋","😎","🤠","👵","🧙‍♀️","🦩"];
const BORDERS = {none:"None", gold:"Gold", silver:"Diamond", chip:"Poker chip", neon:"Neon", fire:"Fire", rainbow:"Rainbow", hearts:"Hearts", crown:"Stars"};
const ACCESSORIES = {none:"None", shades:"🕶️ Shades", bow:"🎀 Bow", flower:"🌸 Flower", party:"🎉 Party hat", halo:"😇 Halo", sparkle:"✨ Sparkles"};
const FONTS = {classic:"Classic", fancy:"Fancy", marquee:"Marquee", type:"Typewriter", bubbly:"Bubbly", elegant:"Elegant"};
const NAME_COLORS = ["#ffffff","#f5c542","#ff8fab","#ff4d5e","#7ec8ff","#7dffb0","#c9a7ff","#ffa94d"];
const lookOf = p => Object.assign(defaultLook(), (p && p.look) || {});
function avatarHTML(p, size="", opts={}){
  const l = lookOf(p);
  const face = l.img ? `<img src="${esc(l.img)}" alt="" draggable="false">` : `<span class="emo">${esc(l.av)}</span>`;
  const top = HOLIDAY ? HATS[HOLIDAY.hat] : (l.acc==="party" ? HATS.party : l.acc==="halo" ? HATS.halo : "");

/* ---------- hand order: smart / suit / number / custom ---------- */
function sortHand(h, mode){
  const so = {S:0,H:1,C:2,D:3};
  const wildLast = c => isWild(c, G.state.settings) ? 1 : 0;
  return [...h].sort((a,b)=>{
    const w = wildLast(a)-wildLast(b); if (w) return w;
    if (isJoker(a)||isJoker(b)) return isJoker(a)-isJoker(b);
    if ((mode||G.sort)==="number") return RV[a[0]]-RV[b[0]] || so[a[1]]-so[b[1]];
    return so[a[1]]-so[b[1]] || RV[a[0]]-RV[b[0]];
  });
}
// Groups cards that are close to being sets or runs, best groups first, leftovers, then wilds.
function smartGroups(h, S){
  const wild = h.filter(c=>isWild(c,S)), nat = h.filter(c=>!isWild(c,S));
  const cands = [];
  for (const su of SUITS) for (const aceHigh of [false,true]) {
    const cs = nat.filter(c=>c[1]===su).map(c=>({c, v:c[0]==="A"?(aceHigh?14:1):RV[c[0]]})).sort((a,b)=>a.v-b.v);
    const u = []; cs.forEach(x=>{ if (!u.length || u[u.length-1].v!==x.v) u.push(x); });
    let chain = u.length ? [u[0]] : [];
    const flush = ()=>{ if (chain.length>=2) { const gaps = chain[chain.length-1].v - chain[0].v + 1 - chain.length; cands.push({cards:chain.map(x=>x.c), score:chain.length - gaps*.6, type:"run"}); } };
    for (let i=1;i<u.length;i++) { if (u[i].v - chain[chain.length-1].v <= 2) chain.push(u[i]); else { flush(); chain = [u[i]]; } }
    flush();
  }
  const byRank = {}; nat.forEach(c=>(byRank[c[0]] = byRank[c[0]]||[]).push(c));
  for (const r in byRank) if (byRank[r].length>=2) cands.push({cards:byRank[r], score:byRank[r].length + .3, type:"set"});
  cands.sort((a,b)=>b.score-a.score);
  const used = new Set(), groups = [];
  for (const g of cands) {
    const free = g.cards.filter(c=>!used.has(c));
    if (free.length<2 || (g.type==="run" && free.length<g.cards.length && free.length<3)) continue;
    free.forEach(c=>used.add(c));
    if (g.type==="run") { const hasHigh = free.some(c=>"QK".includes(c[0])); free.sort((a,b)=>(a[0]==="A"?(hasHigh?14:1):RV[a[0]])-(b[0]==="A"?(hasHigh?14:1):RV[b[0]])); }
    else free.sort((a,b)=>SUITS.indexOf(a[1])-SUITS.indexOf(b[1]));
    groups.push(free);
  }
  const rest = sortHand(nat.filter(c=>!used.has(c)), "suit");
  if (rest.length) groups.push(rest);
  if (wild.length) groups.push(wild);
  return groups;
}
const orderKey = () => `sr_ord_${G.code}_${G.pid}_${G.state.round}_${G.state.created}`;
function orderHand(h){
  const starts = new Set();
  if (G.sort==="smart") {
    const cards = [];
    smartGroups(h, G.state.settings).forEach((g,i)=>{ if (i>0) starts.add(g[0]); cards.push(...g); });
    return {cards, starts};
  }
  if (G.sort==="custom") {
    const saved = JSON.parse(localStorage.getItem(orderKey())||"[]"), set = new Set(h);
    const cards = saved.filter(c=>set.has(c)); h.forEach(c=>{ if (!cards.includes(c)) cards.push(c); });
    return {cards, starts};
  }
  return {cards:sortHand(h), starts};
}
const SORT_LABEL = {smart:"✨ Smart", suit:"♠ Suit", number:"🔢 Number", custom:"✋ My order"};

/* ---------- drag to rearrange your hand ---------- */
let D = null;
function setupDrag(container){
  container.querySelectorAll(".card").forEach(el=>{
    el.addEventListener("pointerdown", e=>{
      if (e.button>0) return;
      D = {el, container, x0:e.clientX, y0:e.clientY, x:e.clientX, y:e.clientY, active:false, ghost:null, target:null, after:false};
      D.timer = setTimeout(()=>{ if (D && !D.active) activateDrag(); }, 300);
    });
  });
}
function activateDrag(){
  if (!D || !D.el.isConnected) { D = null; return; }
  D.active = true; clearTimeout(D.timer);
  const r = D.el.getBoundingClientRect();
  const g = D.el.cloneNode(true); g.classList.remove("sel"); g.classList.add("dragghost");
  g.style.width = r.width+"px"; g.style.height = r.height+"px"; g.style.left = r.left+"px"; g.style.top = r.top+"px";
  D.offX = D.x - r.left; D.offY = D.y - r.top;
  document.body.appendChild(g); D.ghost = g; D.el.classList.add("dragging");
  try { navigator.vibrate && navigator.vibrate(15); } catch(e){}
  Sound.play("tap");
}
function moveDrag(x,y){
  D.x = x; D.y = y;
  if (!D.active) {
    const dx = x-D.x0, dy = y-D.y0;
    if (Math.abs(dx)>8 && Math.abs(dx)>Math.abs(dy)) activateDrag();
    else if (Math.abs(dy)>10) { cancelDrag(); return; }
    else return;
  }
  D.ghost.style.left = (x-D.offX)+"px"; D.ghost.style.top = (y-D.offY)+"px";
  let best = null, bd = 1e9;
  D.container.querySelectorAll(".card").forEach(c=>{
    c.classList.remove("ins-before","ins-after");
    if (c===D.el) return;
    const r = c.getBoundingClientRect(), cx = r.left+r.width/2, cy = r.top+r.height/2;
    const d = Math.hypot(cx-x, (cy-y)*1.4); if (d<bd) { bd = d; best = {c, after: x>cx}; }
  });
  D.target = best;
  if (best) best.c.classList.add(best.after?"ins-after":"ins-before");
}
function endDrag(){
  if (!D) return;
  clearTimeout(D.timer);
  if (D.active) {
    G.suppressClick = true; setTimeout(()=>G.suppressClick=false, 350);
    const order = [...D.container.querySelectorAll(".card")].map(c=>c.dataset.c);
    const moving = D.el.dataset.c;
    if (D.target) {
      const rest = order.filter(c=>c!==moving);
      let i = rest.indexOf(D.target.c.dataset.c); if (D.target.after) i++;
      rest.splice(i, 0, moving);
      localStorage.setItem(orderKey(), JSON.stringify(rest));
      G.sort = "custom"; localStorage.setItem("sr_sort", G.sort);
      Sound.play("flick");
    }
  }
  const was = D.active; cancelDrag();
  if (was) render();
}
function cancelDrag(){
  if (!D) return;
  clearTimeout(D.timer);
  if (D.ghost) D.ghost.remove();
  if (D.el) D.el.classList.remove("dragging");
  if (D.container) D.container.querySelectorAll(".ins-before,.ins-after").forEach(c=>c.classList.remove("ins-before","ins-after"));
  D = null;
}

window.addEventListener("pointerup", endDrag);

  const {cards:shown, starts} = orderHand(hand.filter(c=>!stagedSet.has(c)));
  const total = pid => (s.scores[pid]||[]).reduce((a,b)=>a+b,0);
  const canDraw = mine && s.phase==="draw";
  const justDown = down && s.downAt && s.downAt[me]===(s.turnNo||0);
  const canLayOff = mine && s.phase==="play" && down && !justDown && G.sel.size>0;
  const k = CONTRACTS[s.round];
  const prevMeldIds = new Set([...document.querySelectorAll("[data-meld]")].map(e=>+e.dataset.meld));
  const myLastNudge = [...s.log].reverse().find(e=>e.k==="nudge" && e.p===me);
  const nudgeWait = myLastNudge ? Math.max(0, 10 - Math.floor((Date.now()-myLastNudge.t)/60000)) : 0;

  let status;
  if (s.status!=="playing") status = `Round over — <button class="small" id="showres">Show results</button>`;
  else if (!mine) status = `${Presence.get(turnPid).online && Presence.get(turnPid).active ? "🤔 "+esc(pname(s,turnPid))+" is thinking…" : "Waiting for "+esc(pname(s,turnPid))+"…"}${s.turnAt?` <span class="turnt" style="font-weight:600">(${since(s.turnAt)})</span>`:""} <button class="small" id="nudge" ${nudgeWait?"disabled":""} style="margin-left:6px">👉 ${nudgeWait?`Nudge in ${nudgeWait}m`:"Nudge"}</button>`;
  else if (s.phase==="draw") status = "Your turn! Tap the deck or the discard pile.";
  else if (!down) status = "Make your groups and lay down if you can — then discard.";
  else if (justDown) status = "Nice! You're down. Discard to finish your turn — you can add to melds next turn.";
  else status = "Add cards to any meld (select, then tap it) — then discard.";

  const lastOther = [...s.log].reverse().find(l=>l.p && l.p!==me) || [...s.log].reverse()[0];

  const opps = s.players.filter(p=>p.id!==me).map(p=>{
    const n = (s.hands[p.id]||[]).length;
    const pr = Presence.get(p.id), theirTurn = p.id===turnPid && s.status==="playing";
    const live = (pr.online && pr.active ? (theirTurn ? `<span class="think">🤔 thinking<i>.</i><i>.</i><i>.</i></span>` : `<span class="here">● here</span>`) : (pr.online ? `<span class="away">away</span>` : ""))
      + (theirTurn && s.turnAt ? ` <span class="turnt">⏱ ${since(s.turnAt)}</span>` : "");
    return `<div class="opp ${theirTurn?"turn":""}" data-pid="${esc(p.id)}">
      ${avatarHTML(p,"",{presence:true})}
      <div style="min-width:0"><div>${nameHTML(p)} ${s.down[p.id]?'<span class="tag down">down ✓</span>':''}</div>
      <div class="muted">${n} card${n===1?"":"s"} ${live}</div></div>
      <div class="fan">${'<div class="card back"></div>'.repeat(Math.min(n,7))}</div>
      <span class="chip">${total(p.id)}</span>
    </div>`; }).join("");

  const owners = s.players.filter(p=>s.melds.some(m=>m.owner===p.id));
  const melds = owners.length ? owners.map(p=>`
    <div class="meldsec"><h3>${p.id===me?"Your melds":nameHTML(p)+"'s melds"}</h3>
      <div class="melds">${s.melds.filter(m=>m.owner===p.id).map(m=>`
        <div class="meld ${canLayOff?"target":""} ${G.events.some(e=>e.k==="lay")&&!prevMeldIds.has(m.id)?"pop":""}" data-meld="${m.id}">
          ${m.cards.map(c=>cardHTML(c,"mini")).join("")}<span class="lbl">${esc(meldLabel(m))}</span>
        </div>`).join("")}</div></div>`).join("")
    : `<div class="muted center" style="padding:6px 0">No one has laid down yet. This round: <b>${contractText(s.round)}</b></div>`;

  let stage = "";
  if (!down && G.staged.length) {
    const res = G.staged.length===k.s+k.r ? checkContract(G.staged,k,S) : null;
    stage = `<div class="panel stage"><b>Your groups</b> <span class="muted">(${G.staged.length} of ${k.s+k.r})</span>
      ${G.staged.map((g,i)=>{ const st=analyzeSet(g,S), rn=analyzeRun(g,S,k.rl||4);
        const ok = st||rn ? `<span class="ok">${[st?"set":null,rn?"run":null].filter(Boolean).join(" / ")} ✓</span>` : `<span class="bad">not valid</span>`;
        return `<div class="grp"><div class="cards">${g.map(c=>cardHTML(c,"mini")).join("")}</div>${ok}<button class="ghost small" data-unstage="${i}">✕</button></div>`; }).join("")}
      ${res && !res.ok ? `<div class="bad">${esc(res.msg)}</div>`:""}
      <div class="actions"><button id="laydown" ${res&&res.ok&&mine&&s.phase==="play"?'class="cta"':"disabled"}>✨ Lay down</button><button class="ghost" id="clearstage">Put back</button></div>
    </div>`;
  }

  const buttons = [];
  if (mine && s.phase==="play") {
    if (!down) buttons.push(`<button class="ghost" id="group" ${G.sel.size>=3?"":"disabled"}>Make group (${G.sel.size})</button>`);
    if ((s.undo||[]).some(u=>u.pid===me)) buttons.push(`<button class="ghost" id="undo">↩️ Undo add</button>`);
    buttons.push(`<button id="disc" ${G.sel.size===1?"":"disabled"}>Discard${G.sel.size===1?" "+cardName([...G.sel][0]):""}</button>`);
  }
  const under = n => n>2 ? '<div class="card big back under2"></div><div class="card big back under"></div>' : n>1 ? '<div class="card big back under"></div>' : "";
  const dunder = n => n>1 ? '<div class="card big under" style="opacity:.85"></div>' : "";

  app.innerHTML = `
    <div class="top">
      <div class="info"><div class="rnd goldtext">ROUND ${s.round+1} OF ${roundsOf(s)}${HOLIDAY?` <span class="holtag">${esc(HOLIDAY.name)}</span>`:""}</div><div class="contract">${contractText(s.round)}</div></div>
      ${pushButtonHTML()}
      ${chatButtonHTML(s)}
      ${tb("scores","📊","Scores")}
      ${tb("setb","⚙️","Settings")}
    </div>
    ${ONLINE?"":`<div class="banner">Demo mode (this device only)</div>`}
    <div class="opps">${opps}</div>
    <div class="rail"><div class="felt">
      <div class="piles">
        <div class="pile ${canDraw?"can":""}" id="stock"><div class="stack">${under(s.stock.length)}${cardHTML("back","big")}</div><div>Deck · ${s.stock.length}</div></div>
        <div class="pile ${canDraw&&s.discard.length?"can":""}" id="dpile"><div class="stack">${dunder(s.discard.length)}${s.discard.length?cardHTML(s.discard[s.discard.length-1],"big"):'<div class="card big" style="opacity:.2"></div>'}</div><div>Discard</div></div>
      </div>
      ${melds}
    </div></div>
    <div class="status ${mine?"mine":""}">${status}</div>
    ${!mine && lastOther ? `<div class="last">Last: ${esc(lastOther.m)}</div>`:""}
    ${stage}
    <div class="row" style="justify-content:space-between;margin-top:10px;flex-wrap:wrap;gap:6px">
      <div class="row">${avatarHTML(meP,"sm")} ${nameHTML(meP)} <span class="muted">(${hand.length})</span> <span class="chip">${total(me)}</span></div>
      <div class="toolrow">
        ${G.sel.size?`<button class="ghost small" id="desel">Unselect</button>`:""}
        <button class="ghost small" id="sort">${SORT_LABEL[G.sort]||SORT_LABEL.smart}</button>
      </div>
    </div>
    <div class="hand" id="hand">${shown.map(c=>cardHTML(c,"",(G.sel.has(c)?"sel ":"")+(starts.has(c)?"gstart ":"")+(s.drawn&&s.drawn.pid===me&&s.drawn.c===c&&mine?"new":""))).join("")}</div>
    <div class="muted center" style="font-size:12px;margin-top:-2px">Tap to select · hold & drag to move a card</div>
    ${buttons.length?`<div class="actions dock">${buttons.join("")}</div>`:""}
    ${mine&&s.phase==="play"&&down&&!justDown&&!G.sel.size?`<div class="muted center">Tip: select a card, then tap a meld to add it.</div>`:""}
  `;
  animateTable(before);
  setupDrag($("#hand"));

  app.querySelectorAll(".hand .card").forEach(el=>el.onclick=()=>{
    if (G.suppressClick) return;
    const c = el.dataset.c; G.sel.has(c) ? G.sel.delete(c) : G.sel.add(c); Sound.play("tap"); render();
  });
  $("#sort").onclick = ()=>{ G.sort = nextSort(); localStorage.setItem("sr_sort",G.sort); Sound.play("shuffle"); render(); };
  const ds = $("#desel"); if (ds) ds.onclick = ()=>{ G.sel.clear(); render(); };
  $("#stock").onclick = ()=>{ if (canDraw) act("drawStock"); else if (mine) toast("You already drew this turn", true); };
  $("#dpile").onclick = ()=>{ if (canDraw) act("drawDiscard"); else if (mine) toast("You already drew this turn", true); };
  const sr = $("#showres"); if (sr) sr.onclick = ()=>{ G.peeking = null; G.holdResult = 0; render(); };
  const nb = $("#nudge"); if (nb) nb.onclick = ()=>act("nudge");
  $("#scores").onclick = ()=>showStats("game");
  $("#setb").onclick = showSettings;
  $("#chatb").onclick = openChat;
  wireBell();
  const gb = $("#group"); if (gb) gb.onclick = ()=>{ G.staged.push(sortHand([...G.sel],"suit")); G.sel.clear(); Sound.play("chip"); render(); };
  const ub = $("#undo"); if (ub) ub.onclick = ()=>act("undoLayOff");
  const db = $("#disc"); if (db) db.onclick = async ()=>{ const c=[...G.sel][0]; if (await act("discard",c)) { G.sel.delete(c); } };
  app.querySelectorAll("[data-unstage]").forEach(b=>b.onclick=()=>{ G.staged.splice(+b.dataset.unstage,1); render(); });
  const cs = $("#clearstage"); if (cs) cs.onclick = ()=>{ G.staged=[]; render(); };
  const ld = $("#laydown"); if (ld) ld.onclick = async ()=>{ const g = G.staged; if (await act("layDown", g)) G.staged=[]; else ld.closest(".stage")?.classList.add("shake"); };
  app.querySelectorAll("[data-meld]").forEach(el=>el.onclick=async ()=>{
    if (!canLayOff) { if (mine && s.phase==="play" && !down) toast("Lay down your contract first", true); else if (mine && s.phase==="play" && justDown) toast("You just laid down — you can add to melds starting next turn", true); else if (mine && s.phase==="play") toast("Select a card from your hand first", true); return; }
    const cards = [...G.sel];
    if (!(await act("layOff", cards, +el.dataset.meld))) { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
  });
}

/* ======================= MODALS ======================= */
const SIDE_SHEETS = new Set(["chat","settings","scores","log","rules","push","rec","stats"]);
function openModal(html, kind){
  const m=$("#modal"); m.innerHTML=`<div class="sheet"><div class="grab"></div>${kind!=="result"?'<button class="sheet-x" data-close aria-label="Close">✕</button>':""}${html}</div>`; m.hidden=false; m.classList.remove("closing"); G.modalKind=kind;
  const close = ()=>{ if (kind==="rec") Media.cancelRec(); closeModal(true); if (G.state && SIDE_SHEETS.has(kind)) setTimeout(render, 230); };
  m.onclick=e=>{ if(e.target===m && kind!=="result") close(); };
  m.querySelectorAll("[data-close]").forEach(b=>b.onclick=close);
  // drag the sheet down to dismiss
  const sheet = m.querySelector(".sheet"), grab = m.querySelector(".grab");
  let y0 = null, dy = 0;
  const startY = e => { if (kind==="result") return; const t = e.touches ? e.touches[0] : e; if (sheet.scrollTop > 0 && e.target !== grab) return; y0 = t.clientY; dy = 0; sheet.style.transition = "none"; };
  sheet.addEventListener("touchstart", startY, {passive:true});
  sheet.addEventListener("touchmove", e=>{ if (y0===null) return; dy = Math.max(0, e.touches[0].clientY - y0); if (dy>0 && sheet.scrollTop<=0) { sheet.style.transform = `translateY(${dy}px)`; } }, {passive:true});
  sheet.addEventListener("touchend", ()=>{ if (y0===null) return; y0 = null; sheet.style.transition = ""; if (dy > 110) close(); else sheet.style.transform = ""; });
}
function closeModal(animated){
  const m=$("#modal"); G.modalKind=null;
  if (animated && !m.hidden) { m.classList.add("closing"); setTimeout(()=>{ if (!G.modalKind) { m.hidden=true; m.innerHTML=""; m.classList.remove("closing"); } }, 220); }
  else { m.hidden=true; m.innerHTML=""; m.classList.remove("closing"); }
}
function scoreTable(s){
  const rows = [];
  for (let r=0; r<roundsOf(s); r++) {
    if (!s.players.some(p=>(s.scores[p.id]||[])[r]!==undefined)) continue;
    rows.push(`<tr><td>${r+1}. ${contractText(r)}</td>${s.players.map(p=>`<td>${s.scores[p.id][r]}</td>`).join("")}</tr>`);
  }
  return `<table><tr><th>Round</th>${s.players.map(p=>`<th>${avatarHTML(p,"sm")}<br>${esc(p.name)}</th>`).join("")}</tr>${rows.join("")}
    <tr class="tot"><td>Total</td>${s.players.map(p=>`<td>${(s.scores[p.id]||[]).reduce((a,b)=>a+b,0)}</td>`).join("")}</tr></table>
    <p style="font-size:13px;color:#666">Lowest total wins.</p>`;
}
function rivalryBox(s){ return `<div style="background:#0f5a38;color:#fff;border-radius:12px;padding:8px;margin:6px 0 10px">${Rivalry.html(s)}</div>`; }
function showScores(s){ showStats("game"); }
async function showStats(tab){
  const s = G.state; if (!s) return;
  const body = ()=>{
    if (tab==="game") return s.status==="lobby" ? `<p class="muted" style="color:#777">Scores show up once the cards are dealt.</p>` : `${rivalryBox(s)}${scoreTable(s)}`;
    if (!History.rows) return `<div class="skel"></div><div class="skel"></div>`;
    return s.players.map(p=>{
      const st = History.statsFor(p.name);
      const champ = History.isChampion(p.name);
      const tiles = [
        ["Games", st.games], ["Wins", st.wins], ["Win rate", st.games? st.pct+"%":"—"], ["Win streak", st.streak],
        ["Best streak", st.best], ["Rounds won", st.outs], ["Avg pts/round", st.avg ?? "—"], ["Best game", st.low ?? "—"],
        ["Worst game", st.high ?? "—"], ["Fave discard", st.favDiscard ?? "—"]];
      const h2h = Object.entries(st.h2h).map(([o,h])=>`<div class="h2h"><span>vs ${esc(o.replace(/^./,c=>c.toUpperCase()))}</span><b>${h.w}–${h.l}${h.t?`–${h.t}`:""}</b></div>`).join("");
      const form = st.last.length ? `<div class="form">${st.last.map(g=>`<i class="${g.won?"w":g.tie?"t":"l"}" title="${g.t} pts">${g.won?"W":g.tie?"T":"L"}</i>`).join("")}</div>` : "";
      return `<div class="statcard">
        <div class="stathead">${avatarHTML(p,"lg")}<div><div style="font-size:22px">${nameHTML(p)}</div>${champ?`<div class="champtag">👑 All-time champion · ${History.topWins} wins</div>`:""}</div></div>
        <div class="tiles">${tiles.map(([k,v])=>`<div class="tile"><b>${esc(v)}</b><span>${k}</span></div>`).join("")}</div>
        ${form?`<div class="lbl">Last ${st.last.length} games</div>${form}`:""}
        ${h2h?`<div class="lbl">Head to head</div>${h2h}`:""}
      </div>`;
    }).join("") + `<p class="muted" style="color:#888;font-size:12px;text-align:center">Lower scores are better. Stats count finished games only.</p>`;
  };
  const draw = ()=>{
    openModal(`<h2>📊 ${tab==="game"?"Scores":"Stats"}</h2>
      <div class="seg"><button data-t="game" class="${tab==="game"?"on":""}">This game</button><button data-t="all" class="${tab==="all"?"on":""}">All-time</button></div>
      <div id="statbody">${body()}</div>
      <button class="ghost" data-close style="width:100%;margin-top:10px">Close</button>`, "stats");
    document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ tab=b.dataset.t; draw(); if (tab==="all") History.load(true).then(()=>{ if (G.modalKind==="stats" && tab==="all") $("#statbody").innerHTML = body(); }); });
  };
  draw();
  if (tab==="all") { await History.load(true); if (G.modalKind==="stats") $("#statbody").innerHTML = body(); }
}
function showLog(s){ openModal(`<h2>📜 What happened</h2>${[...s.log].reverse().map(l=>`<div class="logl">${esc(l.m)}</div>`).join("")}<br><button class="ghost" data-close style="width:100%">Close</button>`,"log"); }
function showResult(s){
  const r = s.result || (s.status==="gameOver" ? {winner:null, pts:{}, hands:{}} : null); if (!r) return;
  if (SIDE_SHEETS.has(G.modalKind)) return;
  if (G.peeking===G.version) { if (G.modalKind==="result") closeModal(); return; }
  if (G.modalKind==="result" && G.resultFor===G.version) return;
  const over = s.status==="gameOver";
  let head;
  const conceded = over && s.endReason==="concede";
  if (over) {
    const w = gameWinner(s);
    head = `<div class="winner">🏆 ${w==="tie"?"It's a tie!":esc(pname(s,w))+" wins the game!"}</div>${conceded?`<div class="center" style="color:#8a6a2a;font-weight:700;margin:-6px 0 10px">🏳️ ${esc(pname(s,s.concededBy))} conceded</div>`:""}`;
  } else head = `<div class="winner">${esc(pname(s,r.winner))} went out! 🎉</div>`;
  const hands = conceded ? "" : s.players.filter(p=>p.id!==r.winner).map(p=>`
    <div class="result"><div class="who">${avatarHTML(p,"sm")} ${esc(p.name)}: +${r.pts[p.id]} pts</div>
    <div class="cards">${r.hands[p.id].map(c=>cardHTML(c,"mini")).join("")}</div></div>`).join("");
  const btn = over
    ? `<button id="again" class="cta" style="width:100%">🎰 Play again</button>`
    : s.round >= roundsOf(s)-1
      ? `<button id="next" class="cta" style="width:100%">🏆 See the final results</button>`
      : `<button id="next" class="cta" style="width:100%">Deal round ${s.round+2}: ${contractText(s.round+1)} (${CONTRACTS[s.round+1].n} cards)</button>`;
  openModal(`<h2>${over?(conceded?"Game conceded":"Game over"):"Round "+(s.round+1)+" finished"}</h2>${head}${hands}${over?rivalryBox(s):""}<h3>Scores</h3>${scoreTable(s)}${btn}
    <button class="ghost" id="peek" style="width:100%;margin-top:8px">Look at the table</button>`, "result");
  G.resultFor = G.version;
  const n = $("#next"); if (n) n.onclick = ()=>{ closeModal(); act("nextRound", s.round); };
  const a = $("#again"); if (a) a.onclick = ()=>{ closeModal(); act("rematch", s.created); };
  $("#peek").onclick = ()=>{ G.peeking = G.version; closeModal(); };
}

/* ---------- chat + stickers + voice stickers ---------- */
const VOICE_EMOJI = ["🎤","😂","🙌","😜","🤣","😤","🥰","🤬","👋","🎉","😱","💅"];
function myLook(){ const s = G.state; const me = s && s.players.find(p=>p.id===G.pid); return me ? lookOf(me) : defaultLook(); }
function saveMyLook(L){ const s = G.state; const me = s && s.players.find(p=>p.id===G.pid); if (!me) return; const look = Object.assign({}, L); act("look", look); Profiles.save(me.name, look); }
function voiceChips(){
  const vs = myLook().voices || [];
  return vs.map((v,i)=>`<button class="vchip" data-vs="${i}">${esc(v.e)}<small>${esc(v.l||"Voice")}</small></button>`).join("") +
    (vs.length < 8 ? `<button class="vchip new" id="recnew">🎙️<small>New sound</small></button>` : "");
}
function openChat(){
  const s = G.state; if (!s) return;
  openModal(`<h2>💬 Table talk</h2>
    <div class="chatlist" id="chatlist"></div>
    <div class="typing" id="typing"></div>
    <div class="seg"><button class="on" data-tab="st">Stickers</button><button data-tab="vo">🎤 My sounds</button></div>
    <div id="tab-st" class="stickers">${STICKERS.map(k=>`<button data-st="${k.id}">${k.em}<small>${k.label}</small></button>`).join("")}</div>
    <div id="tab-vo" class="vgrid" hidden>${voiceChips()}</div>
    <div class="chatin"><input type="text" id="chatmsg" maxlength="300" placeholder="Say something…" enterkeyhint="send" autocomplete="off"><button id="chatsend">Send</button></div>`, "chat");
  localStorage.setItem(readKey(), String(s.chatSeq||0));
  refreshChat(); refreshTyping();
  const send = async ()=>{ const i=$("#chatmsg"); const t=i.value.trim(); if (!t) return; i.value=""; Presence.set({typing:false}); Sound.play("flick"); if (!(await act("say", t))) i.value=t; };
  $("#chatsend").onclick = send;
  let typT = null;
  $("#chatmsg").onkeydown = e=>{ if (e.key==="Enter") send(); };
  $("#chatmsg").oninput = ()=>{ Presence.set({typing:true}); clearTimeout(typT); typT = setTimeout(()=>Presence.set({typing:false}), 3000); };
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("on", x===b)); $("#tab-st").hidden = b.dataset.tab!=="st"; $("#tab-vo").hidden = b.dataset.tab!=="vo"; });
  document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>act("say", "", b.dataset.st));
  wireVoiceChips();
}
function wireVoiceChips(){
  document.querySelectorAll("[data-vs]").forEach(b=>b.onclick=()=>{ const v = (myLook().voices||[])[+b.dataset.vs]; if (v) act("say", "", null, v); });
  const n = $("#recnew"); if (n) n.onclick = openRecorder;
}
function refreshTyping(){
  const el = $("#typing"); if (!el || !G.state) return;
  const who = G.state.players.filter(p=>p.id!==G.pid && Presence.get(p.id).typing).map(p=>p.name);
  el.innerHTML = who.length ? `${esc(who.join(" & "))} ${who.length>1?"are":"is"} typing<i>.</i><i>.</i><i>.</i>` : "";
}
function refreshChat(){
  const el = $("#chatlist"); if (!el || !G.state) return;
  const s = G.state, msgs = s.chat||[];
  el.innerHTML = msgs.length ? msgs.map(m=>{
    const p = s.players.find(x=>x.id===m.p) || {name:"?"}, me = m.p===G.pid;
    let body;
    if (m.vs) body = `<button class="bubble vbub" data-play="${esc(m.vs.u)}">${esc(m.vs.e)} <span>${esc(m.vs.l||"Voice")}</span> <b>▶</b><span class="when">${esc(p.name)} · ${timeAgo(m.t)}</span></button>`;
    else if (m.st) body = `<div class="bubble st" title="${esc(stickerById(m.st).label)}">${stickerById(m.st).em}</div>`;
    else body = `<div class="bubble">${esc(m.text)}<span class="when">${esc(p.name)} · ${timeAgo(m.t)}</span></div>`;
    return `<div class="msg ${me?"me":""}">${avatarHTML(p,"sm")}${body}</div>`;
  }).join("") : `<div class="muted center" style="color:#777;padding:18px 0">No messages yet. Say hi! 👋</div>`;
  el.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>Media.play(b.dataset.play));
  el.scrollTop = el.scrollHeight;
}
/* ---------- voice recorder sheet ---------- */
function openRecorder(){
  let clip = null, url = null, emo = "🎤", timer = null;
  openModal(`<h2>🎙️ New sound</h2>
    <p class="sheet-sub">Record up to 5 seconds — a laugh, a “Gotcha!”, anything. It's saved under your name to use any time.</p>
    <div class="recwrap"><button class="recbtn" id="recbtn"><span class="ring" id="recring"></span><span id="reclbl">🎙️</span></button>
    <div class="rectime" id="rectime">Tap to record</div></div>
    <div id="recpost" hidden>
      <div class="row" style="justify-content:center;gap:10px;margin:6px 0 12px"><button class="ghost" id="recplay">▶ Play it back</button><button class="ghost" id="recredo">↺ Redo</button></div>
      <h3>Pick an icon</h3><div class="pick emo" id="recemo">${VOICE_EMOJI.map((e,i)=>`<button class="${i===0?"on":""}" data-e="${e}">${e}</button>`).join("")}</div>
      <h3>Name it</h3><input type="text" id="recname" maxlength="20" placeholder="e.g. Ha! Gotcha">
      <button id="recsave" style="width:100%;margin-top:12px">Save & send</button>
    </div>
    <button class="ghost" data-close style="width:100%;margin-top:10px">Cancel</button>`, "rec");
  const btn = $("#recbtn"), ring = $("#recring"), lbl = $("#reclbl"), tm = $("#rectime");
  const stop = async ()=>{
    clearInterval(timer); btn.classList.remove("live"); lbl.textContent = "🎙️";
    const r = await Media.stopRec();
    if (!r) { tm.textContent = "Didn't catch that — tap to try again"; return; }
    clip = r.blob; url = URL.createObjectURL(clip); tm.textContent = `${r.secs.toFixed(1)} seconds`;
    $("#recpost").hidden = false; Media.play(url);
  };
  btn.onclick = async ()=>{
    if (Media.rec) return stop();
    try {
      await Media.startRec(l=>{ ring.style.transform = `scale(${1+Math.min(.6,l*2.2)})`; ring.style.opacity = .35+Math.min(.6,l*3); });
      btn.classList.add("live"); lbl.textContent = "⏹"; $("#recpost").hidden = true;
      const t0 = Date.now(); tm.textContent = "Recording… 5";
      timer = setInterval(()=>{ const left = 5 - (Date.now()-t0)/1000; tm.textContent = `Recording… ${Math.max(0,Math.ceil(left))}`; if (left<=0) stop(); }, 200);
    } catch(e){ tm.textContent = "Microphone is blocked — allow it in your phone's settings"; Sound.play("nope"); }
  };
  $("#recplay").onclick = ()=>url && Media.play(url);
  $("#recredo").onclick = ()=>{ $("#recpost").hidden = true; tm.textContent = "Tap to record"; };
  document.querySelectorAll("#recemo button").forEach(b=>b.onclick=()=>{ emo = b.dataset.e; document.querySelectorAll("#recemo button").forEach(x=>x.classList.toggle("on", x===b)); });
  $("#recsave").onclick = async ()=>{
    if (!clip) return;
    const b = $("#recsave"); b.disabled = true; b.textContent = "Saving…";
    try {
      const u = await Media.upload(clip, "voices", "wav");
      const L = myLook(); L.voices = [...(L.voices||[]), {u, e:emo, l:$("#recname").value.trim()}].slice(-8);
      saveMyLook(L);
      await act("say", "", null, {u, e:emo, l:$("#recname").value.trim()});
      closeModal(); openChat(); setTimeout(()=>document.querySelector('[data-tab="vo"]')?.click(), 50);
    } catch(e){ b.disabled = false; b.textContent = "Save & send"; toast("Couldn't save: " + e.message, true); }
  };
  const origClose = document.querySelector("#modal [data-close]"); if (origClose) origClose.addEventListener("click", ()=>Media.cancelRec());
}

/* ======================= PUSH NOTIFICATIONS ======================= */
const Push = (()=>{
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
  const standalone = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const supported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  const DEV = "sr_push_device";                       // this phone said yes to alerts (covers every game)
  const done = new Set();                              // games already signed up this session
  function b64(s){ const p="=".repeat((4-s.length%4)%4); const r=atob((s+p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from([...r].map(c=>c.charCodeAt(0))); }
  async function subscription(){
    const reg = await navigator.serviceWorker.register("sw.js");
    await navigator.serviceWorker.ready;
    return (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64(CONFIG.VAPID_PUBLIC_KEY)}));
  }
  return {
    on(){ return ONLINE && supported() && Notification.permission==="granted" && localStorage.getItem(DEV)==="1"; },
    status(){
      if (!ONLINE) return "unsupported";
      if (this.on()) return "on";
      if (supported()) return "off";
      if (isIOS && !standalone()) return "needs-install";
      return "unsupported";
    },
    // Called whenever a game loads: once this phone allows alerts, every game it plays is signed up automatically.
    async registerGame(code, pid){
      if (!this.on() || !code || !pid) return;
      const k = code + "|" + pid; if (done.has(k)) return; done.add(k);
      try {
        const sub = await subscription();
        const {error} = await SB.from("rummy_push").insert({endpoint:sub.endpoint, game_code:code, player_id:pid, subscription:sub.toJSON()});
        if (error && error.code !== "23505") { done.delete(k); console.warn("alert sign-up failed", error.message); }
      } catch(e){ done.delete(k); console.warn("alert sign-up failed", e); }
    },
    async enable(){
      if (this.status()==="on") { showSettings("alerts"); return; }
      if (!supported()) {
        if (isIOS) return openModal(`<h2>📲 One quick step</h2>
          <p>iPhones only allow game alerts from apps on the home screen:</p>
          <ol style="line-height:1.6"><li>Tap the <b>Share</b> button (square with an arrow) in Safari.</li>
          <li>Tap <b>Add to Home Screen</b>, then <b>Add</b>.</li>
          <li>Open <b>Rummy</b> from your home screen, pick your game, then tap <b>🔕 Alerts</b> at the top.</li></ol>
          <p class="muted" style="color:#777">You only do this once — after that every game buzzes you automatically.</p>
          <button class="ghost" data-close style="width:100%">OK</button>`, "push");
        return toast("This browser can't show notifications", true);
      }
      try {
        const perm = await Notification.requestPermission();
        if (perm !== "granted") return toast("Notifications are turned off for this site in your phone's settings", true);
        await subscription();
        localStorage.setItem(DEV, "1");
        if (G.code && G.pid) await this.registerGame(G.code, G.pid);
        Sound.play("chime"); toast("🔔 Alerts are on — for this game and every game after"); render();
      } catch(e){ toast("Couldn't turn on alerts: " + e.message, true); }
    }
  };
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

/* ======================= BOOT ======================= */
async function openGame(code){
  G.code = code.toUpperCase(); G.state = null; G.version = -1; G.sel.clear(); G.staged = []; G.pid = null; G.loadError = null;
  try { G.be = makeBackend(G.code); } catch(e){ G.be = null; G.loadError = "offline"; render(); return; }
  render();
  try {
    const row = await G.be.get();
    if (!row) { G.code = null; localStorage.removeItem("sr_last"); history.replaceState(null,"",location.pathname); render(); toast("No game with that code", true); return; }
    localStorage.setItem("sr_last", G.code);
    resolvePid(G.code, row.state);
    applyRemote(row);
    Net.set(false);
  } catch(e){ G.loadError = e.message || "offline"; if (ONLINE) Net.set(true); render(); }
  G.be.subscribe(row=>applyRemote(row));
}

if (Net.down || LIB_MISSING) setTimeout(()=>{ Net.down = true; Net.paint(); }, 1000);
setTimeout(()=>{ const sp = $("#splash"); if (sp) { sp.classList.add("gone"); setTimeout(()=>sp.remove(), 600); } }, 950);
History.load();
const qs = new URLSearchParams(location.search).get("g");
if (qs) openGame(qs); else render();
setInterval(()=>{ if (G.code && !document.hidden) refresh(); }, ONLINE ? 5000 : 1500);
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) refresh(); });
</script>
